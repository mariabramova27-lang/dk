<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дорожная карта коворкинга — Мягкая математика</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0a0e1a; --card: #1a2233; --text: #e8edf7; --dim: #8892a8;
  --cyan: #00d4ff; --purple: #a855f7; --pink: #ec4899;
  --mint: #10b981; --gold: #fbbf24; --coral: #ef4444;
}
html, body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden; line-height: 1.6;
  padding: 14px;
}
body::before {
  content: ""; position: fixed; inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(0, 212, 255, 0.12) 0%, transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
  pointer-events: none; z-index: 0;
}
body::after {
  content: ""; position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
  background-size: 40px 40px; pointer-events: none; z-index: 0;
}
.container { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; }

/* HEADER */
.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(26, 34, 51, 0.9); border: 1px solid rgba(0, 212, 255, 0.3);
  border-radius: 20px; padding: 14px 20px; margin-bottom: 18px;
  backdrop-filter: blur(12px); flex-wrap: wrap; gap: 12px;
}
.title-block { display: flex; align-items: center; gap: 12px; }
.title-icon { font-size: 32px; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.title { font-size: 20px; font-weight: 900; background: linear-gradient(135deg, var(--cyan), var(--purple)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }

.stats { display: flex; gap: 12px; flex-wrap: wrap; }
.stat {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255, 255, 255, 0.05); padding: 8px 14px;
  border-radius: 30px; border: 1px solid rgba(0, 212, 255, 0.2);
  font-size: 14px; font-weight: 800;
}
.stat .icon { font-size: 18px; }
.stat .value { color: var(--gold); font-size: 16px; }
.stat .value.stars { color: var(--cyan); }
.stat .value.bulbs { color: var(--mint); }

/* ГЛОБАЛЬНЫЙ ПРОГРЕСС */
.global-progress {
  background: rgba(26, 34, 51, 0.9); border: 1px solid rgba(0, 212, 255, 0.3);
  border-radius: 20px; padding: 16px 20px; margin-bottom: 18px;
  backdrop-filter: blur(12px);
}
.progress-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); font-weight: 700; margin-bottom: 8px; }
.progress-info .current { color: var(--cyan); }
.progress-bar { height: 12px; background: rgba(255, 255, 255, 0.08); border-radius: 10px; overflow: hidden; }
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
  background-size: 200% 200%; border-radius: 10px; transition: width 0.6s ease;
  animation: gradientShift 3s ease infinite;
}
@keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

/* КАРТА */
.roadmap {
  display: flex; flex-direction: column; gap: 16px;
  position: relative;
}
.roadmap::before {
  content: ""; position: absolute; left: 30px; top: 0; bottom: 0;
  width: 3px; background: linear-gradient(180deg, var(--cyan), var(--purple), var(--pink));
  border-radius: 3px; opacity: 0.4;
}

.stage {
  display: flex; gap: 16px; align-items: flex-start;
  background: rgba(26, 34, 51, 0.9); border: 2px solid rgba(0, 212, 255, 0.2);
  border-radius: 20px; padding: 18px; backdrop-filter: blur(12px);
  transition: all 0.3s ease; position: relative; z-index: 1;
  cursor: pointer;
}
.stage:hover { border-color: var(--cyan); transform: translateX(6px); box-shadow: 0 10px 30px rgba(0, 212, 255, 0.15); }
.stage.active { border-color: var(--gold); box-shadow: 0 0 30px rgba(251, 191, 36, 0.3); }
.stage.done { border-color: var(--mint); background: rgba(16, 185, 129, 0.08); }
.stage.done .stage-num { background: var(--mint); color: #001a22; }

.stage-num {
  flex-shrink: 0; width: 60px; height: 60px; border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  color: #001a22; display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 900; box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
}
.stage-content { flex: 1; }
.stage-title {
  font-size: 18px; font-weight: 900; color: var(--text);
  display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
}
.stage-title .emoji { font-size: 22px; }
.stage-desc { font-size: 13px; color: var(--dim); margin-bottom: 10px; }
.stage-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; }
.stage-meta span {
  background: rgba(255, 255, 255, 0.06); padding: 4px 12px;
  border-radius: 20px; font-weight: 700; color: var(--dim);
  border: 1px solid rgba(0, 212, 255, 0.15);
}
.stage-meta .time { color: var(--cyan); }
.stage-meta .reward { color: var(--gold); }

.stage-status {
  position: absolute; top: 14px; right: 14px;
  font-size: 24px; opacity: 0.3; transition: all 0.3s ease;
}
.stage.done .stage-status { opacity: 1; }

/* ТАЙМЕР */
.timer-panel {
  background: rgba(10, 14, 26, 0.9); border: 2px solid var(--gold);
  border-radius: 20px; padding: 20px; margin: 18px 0;
  text-align: center; display: none;
}
.timer-panel.show { display: block; animation: slideDown 0.4s ease; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.timer-label { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; margin-bottom: 8px; }
.timer-display {
  font-size: 64px; font-weight: 900; color: var(--gold);
  font-family: 'Courier New', monospace;
  text-shadow: 0 0 30px rgba(251, 191, 36, 0.5);
  line-height: 1;
}
.timer-display.warning { color: var(--coral); animation: pulse 0.5s ease infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.timer-controls { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }

/* КНОПКИ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(135deg, var(--cyan), #0099cc); color: #001a22;
  padding: 12px 24px; border-radius: 60px; font-size: 14px; font-weight: 900;
  border: none; cursor: pointer; font-family: inherit; min-height: 44px;
  box-shadow: 0 5px 0 #006680, 0 6px 16px rgba(0, 212, 255, 0.3);
  transition: all 0.1s ease; text-transform: uppercase; letter-spacing: 0.5px;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #006680, 0 10px 22px rgba(0, 212, 255, 0.5); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #006680; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
.btn-gold { background: linear-gradient(135deg, var(--gold), #d97706); color: #1a0f00; box-shadow: 0 5px 0 #92400e, 0 6px 16px rgba(251, 191, 36, 0.3); }
.btn-gold:hover { box-shadow: 0 7px 0 #92400e, 0 10px 22px rgba(251, 191, 36, 0.5); }
.btn-gold:active { box-shadow: 0 2px 0 #92400e; }
.btn-secondary { background: transparent; color: var(--cyan); border: 2px solid var(--cyan); box-shadow: none; }
.btn-secondary:hover { background: rgba(0, 212, 255, 0.1); box-shadow: 0 0 20px rgba(0, 212, 255, 0.4); }
.btn-small { padding: 8px 16px; font-size: 12px; min-height: 36px; }
.btn-mint { background: linear-gradient(135deg, var(--mint), #059669); color: #001a22; box-shadow: 0 5px 0 #064e3b, 0 6px 16px rgba(16, 185, 129, 0.3); }
.btn-mint:hover { box-shadow: 0 7px 0 #064e3b, 0 10px 22px rgba(16, 185, 129, 0.5); }

/* ФИНАЛЬНАЯ ПАНЕЛЬ */
.final-panel {
  background: rgba(26, 34, 51, 0.95); border: 2px solid var(--gold);
  border-radius: 24px; padding: 24px; margin-top: 18px;
  display: none;
}
.final-panel.show { display: block; animation: fadeIn 0.5s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.final-title { font-size: 24px; font-weight: 900; text-align: center; background: linear-gradient(135deg, var(--gold), var(--pink)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; }

.score-table { width: 100%; border-collapse: collapse; margin: 16px 0; }
.score-table th, .score-table td { padding: 12px; text-align: center; font-size: 14px; border-bottom: 1px solid rgba(0, 212, 255, 0.2); }
.score-table th { background: rgba(0, 212, 255, 0.15); color: var(--cyan); font-weight: 900; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
.score-table td { color: var(--text); font-weight: 700; }
.score-table td.coins { color: var(--gold); }
.score-table td.stars { color: var(--cyan); }
.score-table td.bulbs { color: var(--mint); }
.score-table tr.total { background: rgba(251, 191, 36, 0.1); font-weight: 900; font-size: 16px; }

/* МОДАЛЬНОЕ ОКНО ВВОДА */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center;
  z-index: 1000; padding: 14px;
}
.modal-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
.modal {
  background: var(--card); border: 2px solid var(--cyan); border-radius: 24px;
  padding: 24px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto;
}
.modal h3 { color: var(--cyan); font-size: 20px; margin-bottom: 16px; text-align: center; }
.modal-input-group { margin-bottom: 14px; }
.modal-input-group label { display: block; font-size: 13px; color: var(--dim); font-weight: 800; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
.modal-input-group input {
  width: 100%; padding: 12px 14px; background: rgba(10, 14, 26, 0.7);
  border: 2px solid rgba(0, 212, 255, 0.3); border-radius: 12px;
  color: var(--text); font-size: 16px; font-family: inherit; font-weight: 700;
}
.modal-input-group input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.1); }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; }
.modal-actions .btn { flex: 1; }

/* КОНФЕТТИ */
.confetti { position: fixed; pointer-events: none; z-index: 9999; font-size: 24px; animation: confettiFall 2s ease-out forwards; }
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

@media (max-width: 600px) {
  .stage { padding: 14px; gap: 12px; }
  .stage-num { width: 48px; height: 48px; font-size: 20px; }
  .stage-title { font-size: 15px; }
  .timer-display { font-size: 48px; }
  .stat { font-size: 12px; padding: 6px 10px; }
  .title { font-size: 16px; }
}
</style>
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <div class="top-bar">
    <div class="title-block">
      <span class="title-icon">🗺️</span>
      <div>
        <div class="title">Дорожная карта коворкинга</div>
        <div class="subtitle">Итоговое занятие · Модуль 1</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="icon">🪙</span><span class="value" id="totalCoins">0</span></div>
      <div class="stat"><span class="icon">⭐</span><span class="value stars" id="totalStars">0</span></div>
      <div class="stat"><span class="icon">💡</span><span class="value bulbs" id="totalBulbs">0</span></div>
    </div>
  </div>

  <!-- ОБЩИЙ ПРОГРЕСС -->
  <div class="global-progress">
    <div class="progress-info">
      <span>Этап: <span class="current" id="currentStageName">Разминка</span></span>
      <span id="progressText">0 / 7</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
  </div>

  <!-- ТАЙМЕР -->
  <div class="timer-panel" id="timerPanel">
    <div class="timer-label" id="timerLabel">Разминка</div>
    <div class="timer-display" id="timerDisplay">10:00</div>
    <div class="timer-controls">
      <button class="btn btn-small" onclick="startTimer()" id="btnStartTimer">▶ Старт</button>
      <button class="btn btn-small btn-secondary" onclick="pauseTimer()" id="btnPauseTimer">⏸ Пауза</button>
      <button class="btn btn-small btn-secondary" onclick="resetTimer()">↺ Сброс</button>
      <button class="btn btn-small btn-mint" onclick="completeStage()">✓ Завершить этап</button>
    </div>
  </div>

  <!-- КАРТА -->
  <div class="roadmap" id="roadmap"></div>

  <!-- ФИНАЛ -->
  <div class="final-panel" id="finalPanel">
    <div class="final-title">🏆 Итоги коворкинга</div>
    <table class="score-table">
      <thead>
        <tr>
          <th>Команда</th>
          <th>🪙 Монеты</th>
          <th>⭐ Звёзды</th>
          <th>💡 Лампочки</th>
          <th>Итого</th>
        </tr>
      </thead>
      <tbody id="finalTableBody">
        <tr>
          <td>🔍 Детективы</td>
          <td class="coins" id="team1Coins">0</td>
          <td class="stars" id="team1Stars">0</td>
          <td class="bulbs" id="team1Bulbs">0</td>
          <td id="team1Total">0</td>
        </tr>
        <tr>
          <td>🧩 Логики</td>
          <td class="coins" id="team2Coins">0</td>
          <td class="stars" id="team2Stars">0</td>
          <td class="bulbs" id="team2Bulbs">0</td>
          <td id="team2Total">0</td>
        </tr>
      </tbody>
    </table>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 16px;">
      <button class="btn btn-gold" onclick="addRewards()">➕ Добавить награды</button>
      <button class="btn btn-secondary" onclick="resetAll()">↺ Сбросить всё</button>
    </div>
  </div>

</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle">Награды команды</h3>
    <div class="modal-input-group">
      <label>Команда</label>
      <select id="modalTeam" style="width: 100%; padding: 12px 14px; background: rgba(10, 14, 26, 0.7); border: 2px solid rgba(0, 212, 255, 0.3); border-radius: 12px; color: var(--text); font-size: 16px; font-weight: 700;">
        <option value="1">🔍 Детективы</option>
        <option value="2">🧩 Логики</option>
      </select>
    </div>
    <div class="modal-input-group">
      <label>🪙 Монеты (0–5)</label>
      <input type="number" id="modalCoins" min="0" max="5" value="0">
    </div>
    <div class="modal-input-group">
      <label>⭐ Звёзды (0–3)</label>
      <input type="number" id="modalStars" min="0" max="3" value="0">
    </div>
    <div class="modal-input-group">
      <label>💡 Лампочки (0–1)</label>
      <input type="number" id="modalBulbs" min="0" max="1" value="0">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-gold" onclick="saveRewards()">✓ Сохранить</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// ДАННЫЕ ЭТАПОВ
// ============================================================
const STAGES = [
  { id: 1, emoji: '🎯', title: 'Разминка', desc: '«Данетки о профессиях» — угадываем профессии вопросами «да/нет»', time: '10:00', reward: 'Разогрев', timerSec: 600 },
  { id: 2, emoji: '👥', title: 'Деление на команды', desc: 'Формируем две команды: 🔍 Детективы и 🧩 Логики', time: '2:00', reward: 'Старт', timerSec: 120 },
  { id: 3, emoji: '🔍', title: 'Числовой ребус', desc: 'КОТ + ТОК = 1111 — команда Детективов ищет решение', time: '5:00', reward: '+5 🪙 +3 ⭐', timerSec: 300 },
  { id: 4, emoji: '🧩', title: 'Магический квадрат', desc: 'Заполни квадрат 3×3 числами от 1 до 9, сумма = 15', time: '5:00', reward: '+5 🪙 +3 ⭐', timerSec: 300 },
  { id: 5, emoji: '🕵️', title: 'Тайна форточки', desc: 'Общее расследование: двое правду, один лжёт', time: '5:00', reward: '+5 🪙 +3 ⭐', timerSec: 300 },
  { id: 6, emoji: '📝', title: 'Рефлексия + своя задача', desc: 'Заполните лист рефлексии и придумайте свою задачу', time: '3:00', reward: 'Творчество', timerSec: 180 },
  { id: 7, emoji: '🎤', title: 'Защита задач', desc: 'Каждая команда предлагает свою задачу другой', time: '10:00', reward: '+5 🪙 +6 ⭐ +2 💡', timerSec: 600 }
];

// ============================================================
// СОСТОЯНИЕ
// ============================================================
let state = {
  currentStage: 0,
  completedStages: [],
  teams: {
    1: { coins: 0, stars: 0, bulbs: 0 },
    2: { coins: 0, stars: 0, bulbs: 0 }
  },
  timer: { running: false, seconds: 0, interval: null }
};

// ============================================================
// ЗАГРУЗКА / СОХРАНЕНИЕ
// ============================================================
function loadState() {
  try {
    const saved = localStorage.getItem('roadmap_kovorking');
    if (saved) {
      const parsed = JSON.parse(saved);
      state.completedStages = parsed.completedStages || [];
      state.teams = parsed.teams || state.teams;
      state.currentStage = parsed.currentStage || 0;
    }
  } catch (e) { /* ignore */ }
  updateAll();
}
function saveState() {
  try {
    localStorage.setItem('roadmap_kovorking', JSON.stringify({
      completedStages: state.completedStages,
      teams: state.teams,
      currentStage: state.currentStage
    }));
  } catch (e) { /* ignore */ }
}

// ============================================================
// РЕНДЕР КАРТЫ
// ============================================================
function renderRoadmap() {
  const container = document.getElementById('roadmap');
  container.innerHTML = '';

  STAGES.forEach((stage, idx) => {
    const isDone = state.completedStages.includes(stage.id);
    const isActive = state.currentStage === idx;

    const el = document.createElement('div');
    el.className = 'stage' + (isDone ? ' done' : '') + (isActive ? ' active' : '');
    el.onclick = () => openStage(idx);

    el.innerHTML = `
      <div class="stage-num">${isDone ? '✓' : stage.id}</div>
      <div class="stage-content">
        <div class="stage-title">
          <span class="emoji">${stage.emoji}</span>
          <span>${stage.title}</span>
        </div>
        <div class="stage-desc">${stage.desc}</div>
        <div class="stage-meta">
          <span class="time">⏱ ${stage.time}</span>
          <span class="reward">🏅 ${stage.reward}</span>
        </div>
      </div>
      <div class="stage-status">${isDone ? '✅' : '⏳'}</div>
    `;

    container.appendChild(el);
  });

  updateProgress();
}

// ============================================================
// ОТКРЫТИЕ ЭТАПА
// ============================================================
function openStage(idx) {
  state.currentStage = idx;
  const stage = STAGES[idx];

  document.getElementById('timerPanel').classList.add('show');
  document.getElementById('timerLabel').textContent = `${stage.emoji} ${stage.title}`;
  document.getElementById('timerDisplay').textContent = formatTime(stage.timerSec);

  resetTimer();
  renderRoadmap();
  document.getElementById('currentStageName').textContent = stage.title;
  saveState();

  // Прокрутка к таймеру
  document.getElementById('timerPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ============================================================
// ТАЙМЕР
// ============================================================
function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function startTimer() {
  if (state.timer.running) return;
  const stage = STAGES[state.currentStage];
  if (!state.timer.seconds) state.timer.seconds = stage.timerSec;

  state.timer.running = true;
  state.timer.interval = setInterval(() => {
    state.timer.seconds--;
    if (state.timer.seconds <= 0) {
      state.timer.seconds = 0;
      clearInterval(state.timer.interval);
      state.timer.running = false;
      document.getElementById('timerDisplay').textContent = '00:00';
      document.getElementById('timerDisplay').classList.add('warning');
      spawnConfetti();
      return;
    }
    document.getElementById('timerDisplay').textContent = formatTime(state.timer.seconds);
    if (state.timer.seconds <= 10) {
      document.getElementById('timerDisplay').classList.add('warning');
    }
  }, 1000);
}

function pauseTimer() {
  if (state.timer.interval) {
    clearInterval(state.timer.interval);
    state.timer.running = false;
  }
}

function resetTimer() {
  pauseTimer();
  const stage = STAGES[state.currentStage];
  state.timer.seconds = stage.timerSec;
  document.getElementById('timerDisplay').textContent = formatTime(stage.timerSec);
  document.getElementById('timerDisplay').classList.remove('warning');
}

function completeStage() {
  const stage = STAGES[state.currentStage];
  if (!state.completedStages.includes(stage.id)) {
    state.completedStages.push(stage.id);
  }
  pauseTimer();
  saveState();

  if (state.completedStages.length === STAGES.length) {
    document.getElementById('finalPanel').classList.add('show');
    spawnConfetti(50);
    document.getElementById('finalPanel').scrollIntoView({ behavior: 'smooth' });
  }

  // Автопереход к следующему этапу
  if (state.currentStage < STAGES.length - 1) {
    state.currentStage++;
  }

  renderRoadmap();
  saveState();
}

// ============================================================
// ПРОГРЕСС
// ============================================================
function updateProgress() {
  const total = STAGES.length;
  const done = state.completedStages.length;
  const pct = (done / total) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${total}`;
}

// ============================================================
// НАГРАДЫ
// ============================================================
function addRewards() {
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalTeam').value = '1';
  document.getElementById('modalCoins').value = '0';
  document.getElementById('modalStars').value = '0';
  document.getElementById('modalBulbs').value = '0';
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function saveRewards() {
  const team = parseInt(document.getElementById('modalTeam').value);
  const coins = Math.max(0, Math.min(5, parseInt(document.getElementById('modalCoins').value) || 0));
  const stars = Math.max(0, Math.min(3, parseInt(document.getElementById('modalStars').value) || 0));
  const bulbs = Math.max(0, Math.min(1, parseInt(document.getElementById('modalBulbs').value) || 0));

  state.teams[team].coins += coins;
  state.teams[team].stars += stars;
  state.teams[team].bulbs += bulbs;

  saveState();
  updateAll();
  closeModal();
  spawnConfetti(15);
}

function updateAll() {
  // Общие счётчики
  const totalCoins = state.teams[1].coins + state.teams[2].coins;
  const totalStars = state.teams[1].stars + state.teams[2].stars;
  const totalBulbs = state.teams[1].bulbs + state.teams[2].bulbs;
  document.getElementById('totalCoins').textContent = totalCoins;
  document.getElementById('totalStars').textContent = totalStars;
  document.getElementById('totalBulbs').textContent = totalBulbs;

  // Команды
  document.getElementById('team1Coins').textContent = state.teams[1].coins;
  document.getElementById('team1Stars').textContent = state.teams[1].stars;
  document.getElementById('team1Bulbs').textContent = state.teams[1].bulbs;
  document.getElementById('team1Total').textContent = state.teams[1].coins + state.teams[1].stars * 2 + state.teams[1].bulbs * 3;

  document.getElementById('team2Coins').textContent = state.teams[2].coins;
  document.getElementById('team2Stars').textContent = state.teams[2].stars;
  document.getElementById('team2Bulbs').textContent = state.teams[2].bulbs;
  document.getElementById('team2Total').textContent = state.teams[2].coins + state.teams[2].stars * 2 + state.teams[2].bulbs * 3;

  // Карта
  renderRoadmap();
}

// ============================================================
// КОНФЕТТИ
// ============================================================
function spawnConfetti(count = 30) {
  const emojis = ['🎉', '🎊', '⭐', '🪙', '💡', '🏆', '✨'];
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.top = '-30px';
    el.style.animationDelay = Math.random() * 0.5 + 's';
    el.style.fontSize = (Math.random() * 20 + 16) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }
}

// ============================================================
// СБРОС
// ============================================================
function resetAll() {
  if (!confirm('Сбросить весь прогресс и награды?')) return;
  state.currentStage = 0;
  state.completedStages = [];
  state.teams = { 1: { coins: 0, stars: 0, bulbs: 0 }, 2: { coins: 0, stars: 0, bulbs: 0 } };
  pauseTimer();
  document.getElementById('timerPanel').classList.remove('show');
  document.getElementById('finalPanel').classList.remove('show');
  saveState();
  updateAll();
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
loadState();
renderRoadmap();
updateAll();

console.log('%c🗺️ Дорожная карта коворкинга загружена!', 'color:#00d4ff;font-size:16px;font-weight:bold');
</script>
</body>
</html>
